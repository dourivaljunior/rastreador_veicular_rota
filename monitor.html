<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Monitoramento - Rota Veicular</title>
    <style>
        html, body, #map { height: 100%; margin: 0; padding: 0; }
        #info { position: absolute; top: 10px; left: 10px; z-index: 1000; background: white; padding: 12px; font-family: Arial, sans-serif; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); color: #333; font-size: 14px; }
        .numero-ponto {
            background: white;
            border: 1px solid #333;
            border-radius: 50%;
            text-align: center;
            font-size: 10px;
            font-weight: bold;
            color: #000;
            line-height: 16px;
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div id="info">Aguardando início da viagem...</div>
    <div id="map"></div>

    <script>
        let map;
        let markerCarro;
        let camadaPontos = L.layerGroup();
        let polylineRota;
        
        // COLE AQUI O SEU LINK ATUALIZADO DO GOOGLE APPS SCRIPT (/exec)
        const urlAPI = "https://script.google.com/macros/s/AKfycbxYXoydlSBOM8j8pIZ36X4JJPY8F5fc4RZKY4TwlvXPu-6GF2IIVVSR-_OPpwek_Mlz6g/exec";

        function initMap() {
            map = L.map('map').setView([-12.9632, -38.4085], 15);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            camadaPontos.addTo(map);
            
            atualizarPainel();
            setInterval(atualizarPainel, 15000);
        }

        // Função para corrigir e formatar a hora exata subtraindo o desvio de fuso se necessário
        function corrigirHorario(dataString) {
            if (!dataString) return 'Agora';
            
            // Se vier no formato ISO do navegador (ex: 2026-09-03T14:36:46.000Z)
            if (dataString.includes('T')) {
                let data = new Date(dataString);
                // Subtrai 3 horas em milissegundos para ajustar para o horário de Brasília (-3h)
                data.setTime(data.getTime() - (3 * 60 * 60 * 1000));
                
                let dia = String(data.getDate()).padStart(2, '0');
                let mes = String(data.getMonth() + 1).padStart(2, '0');
                let ano = data.getFullYear();
                let hora = String(data.getHours()).padStart(2, '0');
                let min = String(data.getMinutes()).padStart(2, '0');
                let seg = String(data.getSeconds()).padStart(2, '0');
                
                return `${dia}/${mes}/${ano} ${hora}:${min}:${seg}`;
            }
            
            // Se já vier formatado bonitinho da planilha
            return dataString;
        }

        function atualizarPainel() {
            fetch(urlAPI)
                .then(response => response.json())
                .then(dados => {
                    if (Array.isArray(dados) && dados.length > 0) {
                        camadaPontos.clearLayers();

                        const latLngs = dados.map(item => [parseFloat(item.lat), parseFloat(item.lng)]);
                        
                        // Desenha a linha azul da rota
                        if (!polylineRota) {
                            polylineRota = L.polyline(latLngs, { color: 'blue', weight: 4, opacity: 0.6 }).addTo(map);
                        } else {
                            polylineRota.setLatLngs(latLngs);
                        }

                        // Adiciona os pontos numerados no mapa (0 verde no início, 1, 2, 3... pretos nos demais)
                        latLngs.forEach((coord, index) => {
                            let textoLabel = index; 
                            let horaFormatada = corrigirHorario(dados[index].timestamp);

                            let iconeNumero = L.divIcon({
                                className: 'numero-ponto',
                                html: textoLabel,
                                iconSize: [18, 18],
                                iconAnchor: [9, 9]
                            });

                            let corBolinha = (index === 0) ? '#28a745' : '#333';

                            L.marker(coord, { icon: iconeNumero })
                             .addTo(camadaPontos)
                             .bindPopup(`<b>Ponto ${index}</b><br>Horário: ${horaFormatada}`);
                        });

                        // O carrinho 🚗 começa exatamente no Ponto 0 (Início) e avança para o último ponto conforme atualiza
                        const pontoAtualCarro = latLngs[latLngs.length - 1]; // Último ponto registrado
                        const ultimoDado = dados[dados.length - 1];
                        const horaUltimaFormatada = corrigirHorario(ultimoDado.timestamp);

                        document.getElementById("info").innerHTML = 
                            `<b>Status:</b> Em movimento 🚗<br>` +
                            `<b>Última atualização:</b> ${horaUltimaFormatada}<br>` +
                            `<b>Total de pontos:</b> ${dados.length}<br>` +
                            `<b>Lat/Lng:</b> ${pontoAtualCarro[0].toFixed(4)}, ${pontoAtualCarro[1].toFixed(4)}`;

                        const iconeCarro = L.divIcon({
                            html: '🚗',
                            className: 'custom-car-icon',
                            iconSize: [30, 30],
                            iconAnchor: [15, 15]
                        });

                        if (!markerCarro) {
                            markerCarro = L.marker(pontoAtualCarro, { icon: iconeCarro }).addTo(map).bindPopup("Posição Atual do Veículo").openPopup();
                        } else {
                            markerCarro.setLatLng(pontoAtualCarro);
                        }

                        map.panTo(pontoAtualCarro);
                    } else {
                        document.getElementById("info").innerHTML = `<b>Status:</b> Aguardando início da viagem (Aperte Iniciar no Celular)`;
                    }
                })
                .catch(err => console.error("Erro ao buscar painel:", err));
        }

        window.onload = initMap;
    </script>
</body>
</html>
